name: plant_disease_detector
description: "AI-powered plant disease detection using Gemini Vision"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # State management
  provider: ^6.1.2

  # Image capture
  image_picker: ^1.1.2

  # Gemini API
  google_generative_ai: ^0.4.6

  # Text-to-speech
  flutter_tts: ^4.0.2

  # Weather & location
  geolocator: ^13.0.1
  http: ^1.2.2

  # Maps (OpenStreetMap - free, no API key required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Phone calls
  url_launcher: ^6.3.1

  # Voice assistant (speech-to-text)
  speech_to_text: ^7.0.0

  # Share diagnosis results
  share_plus: ^10.1.2

  # App info (version, build number)
  package_info_plus: ^8.1.2

  # Local notifications (daily reminders)
  flutter_local_notifications: ^18.0.1

  # PDF report generation
  pdf: ^3.11.1
  printing: ^5.13.4

  # Local storage for scan history
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Env variables (API key)
  flutter_dotenv: ^5.1.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0

  # Firebase (auth + cloud sync for scan history)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/plantiq_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B1D14"
  adaptive_icon_foreground: "assets/icon/plantiq_icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env